name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY: ping_monitor

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux audio deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.BINARY }}-${{ matrix.target }}.tar.gz ${{ env.BINARY }}
          cd ../../..

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ env.BINARY }}.exe" -DestinationPath "${{ env.BINARY }}-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY }}-${{ matrix.target }}
          path: |
            ${{ env.BINARY }}-${{ matrix.target }}.tar.gz
            ${{ env.BINARY }}-${{ matrix.target }}.zip
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p binaries
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} binaries/ \;
          ls -lh binaries/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — Consensus Redesign
          draft: false
          prerelease: false
          generate_release_notes: false
          files: binaries/*
          body: |
            ## Consensus Redesign

            Complete implementation of issue #7.

            ### Downloads

            | Platform | File |
            |---|---|
            | Linux x86_64 | `ping_monitor-x86_64-unknown-linux-gnu.tar.gz` |
            | macOS ARM64 | `ping_monitor-aarch64-apple-darwin.tar.gz` |
            | Windows x86_64 | `ping_monitor-x86_64-pc-windows-msvc.zip` |

            ### What's new

            - Strict-majority consensus (quorum = n/2 + 1)
            - Round-based coordinator with JoinSet
            - True pause recovery (accumulated + resumed_at)
            - Recursive EWMA detector (legacy/shadow/hybrid modes)
            - Gateway evidence with outage-onset freshness
            - Optional isolated-target cue (PM_PREALERT=1)
            - Honest jitter (Option<f64>, no fabricated zeros)

            See [PR #10](https://github.com/clasanch/ping_monitor/pull/10) for full details.
